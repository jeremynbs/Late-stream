[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "late-stream"
version = "0.1.0"
description = "Stream pre-recorded video files (ProRes, H.264, HEVC, ...) to YouTube Live on a schedule."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.0",
  "google-auth-httplib2>=0.1",
  "Flask>=3.0",
  "tzdata",
  "waitress>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
late-stream = "late_stream.cli:main"

[tool.setuptools]
packages = ["late_stream"]

[tool.setuptools.package-data]
late_stream = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
