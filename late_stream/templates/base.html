<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Late Stream{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
{% if session.get('user') %}
<header><div class="in">
  <span class="brand">● Late Stream</span>
  <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint=='index' }}">Streams</a>
  <a href="{{ url_for('settings_page') }}" class="{{ 'active' if request.endpoint=='settings_page' }}">Settings</a>
  <form class="inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="small">Log out</button></form>
</div></header>
{% endif %}
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body></html>
